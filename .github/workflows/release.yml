name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT lets CI run on the release PR; GITHUB_TOKEN-created PRs don't trigger workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Built here, not on `release: published`: a release created with GITHUB_TOKEN starts no other workflows.
  publish:
    name: publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run size

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp dist/tablet/garmin-dashboard.html dist/tablet/start-dashboard.bat release/
          (cd dist/tablet && zip -9 "../../release/garmin-dashboard-${TAG}.zip" garmin-dashboard.html start-dashboard.bat)
          (cd release && sha256sum garmin-dashboard.html start-dashboard.bat "garmin-dashboard-${TAG}.zip" > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/garmin-dashboard.html
            release/garmin-dashboard-${{ env.TAG }}.zip

      # Fixed asset names keep https://github.com/<repo>/releases/latest/download/<name> stable for the tablet updater.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
